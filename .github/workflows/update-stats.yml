
name: Update LeetCode Repository Stats

on:
  push:
    branches:
      - main
    paths-ignore:
      - "stats.json"

  schedule:
    - cron: "17 2 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate repository statistics
        run: python scripts/update_stats.py

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add stats.json README.md

          if git diff --cached --quiet; then
            echo "Statistics are already up to date."
            exit 0
          fi

          git commit -m "Update repository stats"
          git push
